<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlowBreaker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* iOS-specific overrides and animations */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F2F2F7;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        
        .ios-shadow {
            box-shadow: 0 4px 20px 0 rgba(0,0,0,0.05);
        }
        
        .ios-tab-shadow {
            box-shadow: 0 3px 8px 0 rgba(0,0,0,0.12), 0 3px 1px 0 rgba(0,0,0,0.04);
        }

        /* Colors matching iOS HIG */
        .text-ios-blue { color: #007AFF; }
        .bg-ios-blue { background-color: #007AFF; }
        .bg-ios-green { background-color: #34C759; }
        .border-ios-green { border-color: #34C759; }
        .border-ios-red { border-color: #FF3B30; }
        .bg-ios-red-light { background-color: #FFE5E5; }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Prevent text selection during rapid tapping */
        .no-select {
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="text-gray-900 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="pt-12 pb-4 px-6 bg-white border-b border-gray-200 text-center flex-shrink-0 z-10">
        <h1 class="text-xl font-bold tracking-tight">FlowBreaker</h1>
        <p class="text-xs text-gray-500 mt-1 font-medium tracking-wide uppercase">Bulgarian Edition</p>
    </header>

    <!-- Mode Switcher -->
    <div class="px-6 py-4 flex justify-center bg-[#F2F2F7] flex-shrink-0">
        <div class="bg-gray-200/80 rounded-full p-1 flex w-full max-w-sm relative">
            <button id="tab-build" class="flex-1 text-sm font-semibold py-2 rounded-full ios-tab-shadow bg-white text-gray-900 transition-all no-select">Deconstruct</button>
            <button id="tab-speak" class="flex-1 text-sm font-semibold py-2 rounded-full text-gray-500 transition-all no-select">Speak</button>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-1 px-4 pb-8 overflow-y-auto flex flex-col w-full max-w-lg mx-auto relative">
        
        <!-- Progress Indicator -->
        <div class="text-center text-sm text-gray-400 font-semibold mb-4 tracking-wide" id="progress-text">Phrase 1 of 10</div>

        <!-- Flashcard -->
        <div class="bg-white rounded-3xl ios-shadow p-6 mb-6 flex-1 flex flex-col">
            
            <!-- Target English Phrase -->
            <h2 class="text-2xl font-bold text-center mb-8 text-gray-800" id="english-text">I am going to the store.</h2>

            <!-- Build Mode Area -->
            <div id="build-mode-area" class="flex flex-col flex-1">
                
                <!-- Dropzone for building the sentence -->
                <div id="dropzone" class="flex flex-wrap gap-2 min-h-[80px] p-4 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-300 mb-8 content-start transition-all duration-300 items-center justify-center">
                    <!-- Selected word buttons will be injected here -->
                    <span id="dropzone-placeholder" class="text-gray-400 text-sm font-medium">Tap words to build</span>
                </div>

                <!-- Spacer to push word bank to bottom -->
                <div class="flex-1"></div>

                <!-- Word Bank -->
                <div id="word-bank" class="flex flex-wrap gap-3 justify-center mt-auto pb-4">
                    <!-- Unselected word buttons will be injected here -->
                </div>
            </div>

            <!-- Speak Mode Area -->
            <div id="speak-mode-area" class="hidden flex-col flex-1 items-center justify-center">
                <button id="reveal-btn" class="bg-ios-blue text-white font-semibold py-4 px-10 rounded-full text-lg w-full active:scale-95 transition-transform ios-shadow no-select">
                    Reveal Answer
                </button>
                <div id="revealed-text" class="hidden text-3xl font-bold text-center text-gray-800 mt-8 mb-4 w-full px-4 text-balance">
                    <!-- Revealed Bulgarian text goes here -->
                </div>
            </div>
        </div>

        <!-- Next Button (Fixed at bottom) -->
        <button id="next-btn" class="hidden w-full bg-gray-900 text-white font-bold py-4 rounded-2xl text-lg active:scale-95 transition-transform flex-shrink-0 no-select ios-shadow mb-2">
            Next Phrase
        </button>
    </main>

    <script>
        // Data Structure: 10 Conversational Bulgarian Phrases
        const phrases = [
            { en: "I am going to the store.", bg: "Отивам до магазина." },
            { en: "How are you doing today?", bg: "Как си днес?" },
            { en: "I don't understand you.", bg: "Не те разбирам." },
            { en: "What time is it?", bg: "Колко е часът?" },
            { en: "Can you help me?", bg: "Можеш ли да ми помогнеш?" },
            { en: "I want a coffee, please.", bg: "Искам едно кафе, моля." },
            { en: "Where is the bathroom?", bg: "Къде е тоалетната?" },
            { en: "It is very nice to meet you.", bg: "Много ми е приятно да се запознаем." },
            { en: "What are you doing this weekend?", bg: "Какво ще правиш този уикенд?" },
            { en: "I am tired and want to sleep.", bg: "Уморен съм и искам да спя." }
        ];

        // State variables
        let currentMode = 'build'; // 'build' or 'speak'
        let currentIndex = 0;
        let wordObjects = []; // Holds objects: { id, text, used }
        let selectedIds = []; // Holds IDs in order of selection

        // DOM Elements
        const elTabBuild = document.getElementById('tab-build');
        const elTabSpeak = document.getElementById('tab-speak');
        const elProgress = document.getElementById('progress-text');
        const elEnglish = document.getElementById('english-text');
        const elBuildArea = document.getElementById('build-mode-area');
        const elSpeakArea = document.getElementById('speak-mode-area');
        const elDropzone = document.getElementById('dropzone');
        const elWordBank = document.getElementById('word-bank');
        const elRevealBtn = document.getElementById('reveal-btn');
        const elRevealedText = document.getElementById('revealed-text');
        const elNextBtn = document.getElementById('next-btn');

        // Initialization
        function init() {
            setupEventListeners();
            loadPhrase();
        }

        function setupEventListeners() {
            elTabBuild.addEventListener('click', () => switchMode('build'));
            elTabSpeak.addEventListener('click', () => switchMode('speak'));
            elNextBtn.addEventListener('click', nextPhrase);
            elRevealBtn.addEventListener('click', revealAnswer);
            
            // Remove shake class after animation ends to allow re-triggering
            elDropzone.addEventListener('animationend', () => {
                elDropzone.classList.remove('shake');
            });
        }

        // Core Navigation
        function switchMode(mode) {
            currentMode = mode;
            
            // Update Tab UI
            if (mode === 'build') {
                elTabBuild.className = "flex-1 text-sm font-semibold py-2 rounded-full ios-tab-shadow bg-white text-gray-900 transition-all no-select";
                elTabSpeak.className = "flex-1 text-sm font-semibold py-2 rounded-full text-gray-500 transition-all no-select";
                elBuildArea.classList.remove('hidden');
                elBuildArea.classList.add('flex');
                elSpeakArea.classList.add('hidden');
                elSpeakArea.classList.remove('flex');
            } else {
                elTabSpeak.className = "flex-1 text-sm font-semibold py-2 rounded-full ios-tab-shadow bg-white text-gray-900 transition-all no-select";
                elTabBuild.className = "flex-1 text-sm font-semibold py-2 rounded-full text-gray-500 transition-all no-select";
                elBuildArea.classList.add('hidden');
                elBuildArea.classList.remove('flex');
                elSpeakArea.classList.remove('hidden');
                elSpeakArea.classList.add('flex');
            }
            
            loadPhrase();
        }

        function nextPhrase() {
            currentIndex = (currentIndex + 1) % phrases.length;
            loadPhrase();
        }

        function loadPhrase() {
            const phrase = phrases[currentIndex];
            elProgress.textContent = `Phrase ${currentIndex + 1} of ${phrases.length}`;
            elEnglish.textContent = phrase.en;
            elNextBtn.classList.add('hidden');

            if (currentMode === 'build') {
                resetBuildMode(phrase.bg);
            } else {
                resetSpeakMode();
            }
        }

        // Text Normalization (Removes punctuation so buttons don't give away the ending)
        function normalizeText(text) {
            return text.toLowerCase().replace(/[.,?!]/g, '').trim();
        }

        function getWords(text) {
            return normalizeText(text).split(/\s+/);
        }

        // Build Mode Logic
        function resetBuildMode(bgText) {
            const words = getWords(bgText);
            // Create trackable word objects and shuffle them
            wordObjects = shuffleArray([...words]).map((w, i) => ({ id: i, text: w, used: false }));
            selectedIds = [];
            
            // Reset dropzone styles
            elDropzone.className = "flex flex-wrap gap-2 min-h-[80px] p-4 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-300 mb-8 content-start transition-all duration-300 items-center justify-center";
            elDropzone.style.pointerEvents = "auto";
            
            renderBuildUI();
        }

        function renderBuildUI() {
            elDropzone.innerHTML = '';
            elWordBank.innerHTML = '';

            // Render Selected Words
            if (selectedIds.length === 0) {
                elDropzone.innerHTML = `<span class="text-gray-400 text-sm font-medium">Tap words to build</span>`;
            } else {
                selectedIds.forEach(id => {
                    const wordObj = wordObjects.find(w => w.id === id);
                    const btn = createWordButton(wordObj.text, true);
                    btn.onclick = () => handleDeselect(id);
                    elDropzone.appendChild(btn);
                });
            }

            // Render Word Bank
            wordObjects.forEach(wordObj => {
                const btn = createWordButton(wordObj.text, false);
                if (wordObj.used) {
                    // Visually hide it but maintain space layout
                    btn.classList.add('opacity-0', 'pointer-events-none');
                } else {
                    btn.onclick = () => handleSelect(wordObj.id);
                }
                elWordBank.appendChild(btn);
            });
        }

        function createWordButton(text, isSelected) {
            const btn = document.createElement('button');
            btn.textContent = text;
            btn.className = `px-4 py-3 rounded-xl font-medium text-lg transition-transform active:scale-90 no-select ${
                isSelected 
                ? 'bg-gray-800 text-white shadow-sm' 
                : 'bg-white text-gray-800 border border-gray-200 shadow-sm'
            }`;
            return btn;
        }

        function handleSelect(id) {
            // Remove error state if user starts fixing it
            elDropzone.classList.remove('border-ios-red', 'bg-ios-red-light');
            elDropzone.classList.add('border-gray-300', 'bg-gray-50');

            const wordObj = wordObjects.find(w => w.id === id);
            wordObj.used = true;
            selectedIds.push(id);
            renderBuildUI();

            // Auto-check when all words are selected
            if (selectedIds.length === wordObjects.length) {
                checkAnswer();
            }
        }

        function handleDeselect(id) {
            // Remove error state
            elDropzone.classList.remove('border-ios-red', 'bg-ios-red-light');
            elDropzone.classList.add('border-gray-300', 'bg-gray-50');

            const wordObj = wordObjects.find(w => w.id === id);
            wordObj.used = false;
            selectedIds = selectedIds.filter(selectedId => selectedId !== id);
            renderBuildUI();
        }

        function checkAnswer() {
            const currentAttempt = selectedIds.map(id => wordObjects.find(w => w.id === id).text).join(' ');
            const target = getWords(phrases[currentIndex].bg).join(' ');

            if (currentAttempt === target) {
                // Success State
                showBuildSuccess();
            } else {
                // Error State
                elDropzone.classList.remove('border-gray-300', 'bg-gray-50');
                elDropzone.classList.add('border-ios-red', 'bg-ios-red-light', 'shake');
                // Haptic feedback simulation for browsers that support it
                if (navigator.vibrate) navigator.vibrate(50);
            }
        }

        function showBuildSuccess() {
            const phrase = phrases[currentIndex];
            
            // Transform dropzone to show the perfectly punctuated sentence
            elDropzone.className = "flex flex-col gap-1 min-h-[80px] p-6 bg-ios-green rounded-2xl border-2 border-ios-green mb-8 items-center justify-center transition-all duration-300 fade-in";
            elDropzone.innerHTML = `
                <svg class="w-8 h-8 text-white mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                <span class="text-white text-2xl font-bold text-center">${phrase.bg}</span>
            `;
            elDropzone.style.pointerEvents = "none";
            
            // Clear word bank
            elWordBank.innerHTML = '';
            
            // Show next button
            elNextBtn.classList.remove('hidden');
            elNextBtn.classList.add('fade-in');
        }

        // Speak Mode Logic
        function resetSpeakMode() {
            elRevealBtn.classList.remove('hidden');
            elRevealedText.classList.add('hidden');
            elRevealedText.classList.remove('fade-in');
        }

        function revealAnswer() {
            elRevealBtn.classList.add('hidden');
            elRevealedText.textContent = phrases[currentIndex].bg;
            elRevealedText.classList.remove('hidden');
            elRevealedText.classList.add('fade-in');
            
            elNextBtn.classList.remove('hidden');
            elNextBtn.classList.add('fade-in');
        }

        // Utility: Fisher-Yates Shuffle
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Boot
        init();
    </script>
</body>
</html>
